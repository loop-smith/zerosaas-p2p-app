<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroSaaS P2P · Headless Stock-to-Pay ERP &amp; KAL Steward</title>
  <link rel="stylesheet" href="/styles.css" />

</head>
<body>
  <!-- CLEAN MINIMAL TOP HEADER -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">P2P</div>
      <span class="brand-title">ZeroSaaS P2P</span>
      <span class="brand-sep">|</span>
      <span class="brand-sub">Headless Copper ERP · WMS Signal ➔ Signing Limits ➔ Live COMEX PO ➔ 1-Click Dock Scan ➔ RapidOCR 3WM ➔ CFO Check</span>
    </div>
    <div class="top-controls">
      <span class="pill pill-green" id="strictPill">GAAP DR == CR</span>
      <button class="btn-top" id="kalMuteBtn" onclick="handleKalStopOrMute()" title="Stop or Mute KAL Voice (or press Esc)">
        🔊 KAL Voice: ON
      </button>
      <button class="voice-btn" id="micBtn" onclick="toggleVoiceListen()" title="Push-to-Talk to KAL (ElevenLabs Scribe + Turbo v2.5)">
        🎙️ Ask KAL
      </button>
      <button class="btn-top" id="recBtn" onclick="toggleDemoRecorder()" title="Record 60fps Video + Mic + KAL Voice">
        🎥 Record
      </button>
      <button class="btn-top" id="topResetBtn" style="border-color:#94a3b8;font-weight:800;" onclick="resetDemo()" title="1-click self-service reset: wipes &amp; re-seeds all 3 SQLite DBs + hledger journal back to Step 1 (0 FT stock-out)">↺ Reset Queue</button>
    </div>
  </header>

  <div class="shell">
    <!-- PANEL 1: LEFT NAVIGATION RAIL -->
    <aside class="left-rail">
      <div class="left-group">
        <button class="btn-kal-start" id="leftStartKalBtn" onclick="startKalSteward()">
          ▶ Start KAL · P2P Steward
        </button>

        <div class="rail-label" style="margin-top:4px;">Navigation</div>
        <button class="nav-btn active" id="nav-workflow" onclick="setView('workflow')">
          <span>1. P2P Flow Desk</span>
          <span class="nav-tag" id="navStepBadge">Step 1/8</span>
        </button>
        <button class="nav-btn" id="nav-registers" onclick="setView('registers')">
          <span>2. DB &amp; GL Registers</span>
          <span class="nav-tag" id="sqlCountBadge">277 tbls</span>
        </button>
        <button class="nav-btn" id="nav-security" onclick="setView('security')">
          <span>3. SOX &amp; White House SI</span>
          <span class="nav-tag">EO 14434</span>
        </button>
        <button class="nav-btn" id="nav-factory" onclick="setView('factory')">
          <span>4. Software Factory</span>
          <span class="nav-tag">WO 1-18</span>
        </button>
      </div>

      <div class="left-group">
        <div class="rail-label">WMS Stocked Item (1 Item)</div>
        <div class="order-summary-box" id="leftOrderSummary"></div>
      </div>

      <div class="left-group">
        <div class="rail-label">Registers &amp; Guardrails</div>
        <button class="rail-drawer-btn" onclick="openModal('guardrails')">
          <span>🧪 Guardrail Tests</span>
          <span class="badge b-hold">6 Tests</span>
        </button>
        <button class="rail-drawer-btn" onclick="openModal('journal')">
          <span>📜 GL &amp; Audit Register</span>
          <span class="badge b-ready" id="auditCountBadge">1 Hop</span>
        </button>
      </div>
    </aside>

    <!-- PANEL 2: ONE-SCREEN CENTER STAGE -->
    <main class="center-stage" id="centerStage"></main>

    <!-- PANEL 3: RIGHT LEDGER & DOCUMENT / INVOICE VIEWER -->
    <aside class="right-rail" id="rightRail"></aside>
  </div>

  <!-- REGISTER & DOCUMENT ZOOM MODAL -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <div style="font-size:13.5px;font-weight:800;color:var(--text-main);" id="modalTitle">Register</div>
        <button class="btn-top" onclick="closeModal()">✕ Close (Esc)</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <audio id="ttsAudio" style="display:none"></audio>

  <script type="module" src="/app.js"></script>
</body>
</html>
